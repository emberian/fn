# fn's website: site/build_site.py renders the plain docs (README.md, docs/,
# CONTRIBUTING.md, swarmguide/) into static pages and GitHub Pages serves them.
# Needs Settings -> Pages -> Source: "GitHub Actions" (a one-time switch).
# Actions are pinned by commit SHA; the tag each SHA was is in its comment.
name: pages

on:
  push:
    branches: [dev]
    paths:
      - README.md
      - CONTRIBUTING.md
      - AGENTS.md
      - VERSION
      - docs/**
      - swarmguide/**
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build and link-check the site (stdlib Python only)
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 site/build_site.py --check --out build/site --base-path "${BASE_PATH}/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
