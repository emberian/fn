[store]
path="/tank/fn/scratch/operator-config/run/small-community/store"
[listener]
host="127.0.0.1"
port=11961
tls_cert="/tank/fn/scratch/operator-config/run/small-community/tls/cert.pem"
tls_key="/tank/fn/scratch/operator-config/run/small-community/tls/key.pem"
[auth]
required=true
protected_only=true
path="/tank/fn/scratch/operator-config/run/small-community/store/auth.toml"
[posting]
enabled=true
[anchor]
[acl2]
[log]
path="/tank/fn/scratch/operator-config/run/small-community/log/fn.log"
[control]
path="/tank/fn/scratch/operator-config/run/small-community/store/control.sock"
[alerts]
headroom_min_percent=10
refusal_rate_per_minute=30
cooldown_seconds=900
[ops]
mission="small-community"
scope="user"
keep_releases=3
log_max_bytes=67108864
log_keep=7
